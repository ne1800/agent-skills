[targets]
# Canonical multi-agent skills path.
canonical = "~/.agents/skills"

# Agent-specific defaults.
codex = "~/.codex/skills"
claude = "~/.claude/skills"
# OpenCode can read ~/.agents/skills directly.
opencode = "~/.agents/skills"

# Gemini CLI custom commands path (skills are bridged to commands).
gemini_commands = "~/.gemini/commands"
